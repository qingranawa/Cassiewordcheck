name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tags must use the vX.Y.Z format. Got: $env:GITHUB_REF_NAME"
          }
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test CassieWordCheck.Tests/CassieWordCheck.Tests.csproj --configuration Release --verbosity normal

      - name: Build & Publish to dist
        run: dotnet publish CassieWordCheck.csproj -c Release -r win-x64 -o dist --self-contained true "-p:Version=${env:RELEASE_VERSION}" "-p:AssemblyVersion=${env:RELEASE_VERSION}.0" "-p:FileVersion=${env:RELEASE_VERSION}.0" --verbosity quiet

      - name: Clean debug symbols
        run: Remove-Item "dist/*.pdb" -ErrorAction SilentlyContinue

      - name: Install Inno Setup 6
        run: |
          iwr -useb "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:TEMP\innosetup.exe"
          Start-Process -Wait "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$env:ProgramFiles\Inno Setup 6`""

      - name: Compile Setup
        shell: cmd
        run: |
          set TAG=%GITHUB_REF_NAME%
          "C:\Program Files\Inno Setup 6\ISCC.exe" setup.iss /dMyAppVersion=%RELEASE_VERSION%

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          files: "CASSIE-CWC-Tool-Setup-*.exe"
