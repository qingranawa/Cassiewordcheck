name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag, for example v2.4.4"
        required: true
        default: "v2.4.4"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $releaseTag = if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG_INPUT)) {
            $env:GITHUB_REF_NAME
          } else {
            $env:RELEASE_TAG_INPUT
          }

          if ($releaseTag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tags must use the vX.Y.Z format. Got: $releaseTag"
          }
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test CassieWordCheck.Tests/CassieWordCheck.Tests.csproj --configuration Release --verbosity normal

      - name: Build & Publish to dist
        run: dotnet publish CassieWordCheck.csproj -c Release -r win-x64 -o dist --self-contained true "-p:Version=${env:RELEASE_VERSION}" "-p:AssemblyVersion=${env:RELEASE_VERSION}.0" "-p:FileVersion=${env:RELEASE_VERSION}.0" --verbosity quiet

      - name: Clean debug symbols
        run: Remove-Item "dist/*.pdb" -ErrorAction SilentlyContinue

      - name: Install Inno Setup 6
        shell: pwsh
        env:
          INNO_SETUP_VERSION: 6.5.0
          INNO_SETUP_SHA256: 79b7a1063b3888bb8eceb44a8c28e90ccdaa22ac71f9272de1dac79b42941dbd
        run: |
          $installer = Join-Path $env:TEMP "innosetup-$env:INNO_SETUP_VERSION.exe"
          $downloadUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_5_0/innosetup-$env:INNO_SETUP_VERSION.exe"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "Inno Setup installer was not downloaded: $installer"
          }

          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:INNO_SETUP_SHA256) {
            throw "Inno Setup installer hash mismatch. Expected $env:INNO_SETUP_SHA256, got $actualHash"
          }

          $installDir = Join-Path ${env:ProgramFiles} 'Inno Setup 6'
          $arguments = @(
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            "/DIR=`"$installDir`""
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WorkingDirectory $env:TEMP -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installer failed with exit code $($process.ExitCode)"
          }

          $iscc = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not installed: $iscc"
          }
          "INNO_SETUP_COMPILER=$iscc" >> $env:GITHUB_ENV

      - name: Compile Setup
        shell: pwsh
        run: |
          & $env:INNO_SETUP_COMPILER setup.iss "/dMyAppVersion=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: "CASSIE-CWC-Tool-Setup-*.exe"
