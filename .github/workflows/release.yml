name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag, for example v2.5.1"
        required: true
        default: "v2.5.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $releaseTag = if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG_INPUT)) {
            $env:GITHUB_REF_NAME
          } else {
            $env:RELEASE_TAG_INPUT
          }

          if ($releaseTag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tags must use the vX.Y.Z format. Got: $releaseTag"
          }
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test CassieWordCheck.Tests/CassieWordCheck.Tests.csproj --configuration Release --verbosity normal

      - name: Restore WinUI 3 project
        run: dotnet restore CassieWordCheck.WinUI/CassieWordCheck.WinUI.csproj

      - name: Package with Velopack
        shell: pwsh
        run: pwsh -NoProfile -File scripts/pack-velopack.ps1 -Configuration Release -Version $env:RELEASE_VERSION

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: "dist/velopack/Releases/**"
